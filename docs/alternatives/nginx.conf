# Daymark Companion behind nginx.
#
# nginx terminates TLS and proxies to the container (daymark-companion:8080 on a shared network,
# or 127.0.0.1:8080 if you kept the loopback publish). nginx forwards every request header the
# client sent unless a proxy_set_header replaces it, so each header below is set, never passed
# through. The app reads only X-Forwarded-For (docs/COMPANION_DEPLOYMENT.md §4.0).
#
# Needs nginx 1.25.1 or later, for `http2 on;`. On an older nginx, delete that line, make the
# `listen 443 ssl;` above it `listen 443 ssl http2;`, and read the note on ssl_reject_handshake.

upstream daymark_companion {
    server daymark-companion:8080;
    keepalive 16;
}

# ── Catch-all: refuse every host name this file does not serve ──────────────
# Requirement 5 of docs/COMPANION_DEPLOYMENT.md §3.1. Without these two blocks, the first server
# on each port is its default, and a request naming any host at all reaches the Companion.
#
# `return 444` closes the connection without an answer. On 443, ssl_reject_handshake refuses an
# unknown or missing SNI during the TLS handshake, so the block needs no certificate. It is used
# rather than a self-signed placeholder certificate because there is nothing to create or renew,
# and a client that did not ask for daymark.example.com is refused before it is shown any
# certificate. It needs nginx 1.19.4 or later; on an older one, give this block a self-signed
# certificate of its own (ssl_certificate, ssl_certificate_key) instead, and keep `return 444`.
# A request naming another host on a connection opened for daymark.example.com lands here too:
# over HTTP/1.1 it gets `return 444`, and over HTTP/2 nginx's own 421 Misdirected Request,
# because this block does not turn HTTP/2 on. Neither reaches the Companion.
#
# Only one server per address and port can be default_server. If another file already claims
# one (Debian's sites-enabled/default does, for port 80), `nginx -t` fails: disable that file.
# If the blocks below also listen on IPv6, give each listen here a [::] twin, or requests over
# IPv6 miss the catch-all.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 443 ssl;
    http2 on;
    server_name daymark.example.com;

    ssl_certificate     /etc/ssl/daymark/fullchain.pem;
    ssl_certificate_key /etc/ssl/daymark/privkey.pem;

    # HSTS at the terminator (not in the app container).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Backups can be a few MiB; allow a sensible request body.
    client_max_body_size 32m;

    # Set for the whole server, so every location inherits them. A location that sets even one
    # proxy_set_header of its own inherits none of these, and must repeat them all.
    proxy_set_header   Host              $server_name;   # the configured name, never the visitor's
    proxy_set_header   X-Forwarded-For   $remote_addr;   # set, not append — drop any client value
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $server_name;

    location / {
        proxy_pass         http://daymark_companion;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # Liveness (optional external check).
    location = /healthz {
        proxy_pass http://daymark_companion;
        access_log off;
    }
}

# Redirect plain HTTP to HTTPS, for this name only; the catch-all refuses every other.
server {
    listen 80;
    server_name daymark.example.com;
    return 308 https://$server_name$request_uri;
}

# Sub-path: to serve under https://host/daymark, set DAYMARK_BASE_PATH=/daymark and use
#   location /daymark/ { proxy_pass http://daymark_companion; ... }
# (do not strip the prefix — the app expects it).
