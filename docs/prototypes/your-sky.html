<title>Your Sky</title>
<style>
  :root { --page: #0E0E12; --night: #07070A; --ink: #EBE5D8; --soft: #B7AF9E; --faint: #8E887A; --hair: #34312A; --sheet: #24221D; --sans: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; --serif: Georgia, "Noto Serif", "Times New Roman", serif; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 20px; }
  .page { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-block: 24px; padding-inline: 16px; min-height: 100%; box-sizing: border-box; }
  .frame { position: relative; width: min(390px, 100%); height: min(844px, calc(100dvh - 90px)); min-height: 520px; background: var(--night); border-radius: 22px; overflow: hidden; box-shadow: 0 0 0 1px #1C1B22, 0 30px 80px rgba(0,0,0,0.6); touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .top { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 8px; height: 64px; padding: 0 8px 0 4px; pointer-events: none; background: linear-gradient(rgba(7,7,10,0.92), rgba(7,7,10,0.6) 60%, rgba(7,7,10,0)); }
  .top > * { pointer-events: auto; }
  .iconbtn { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border: 0; background: transparent; color: var(--ink); border-radius: 24px; cursor: pointer; }
  .title { flex-grow: 1; display: flex; flex-direction: column; gap: 0; pointer-events: none; }
  .title .name { font-family: var(--serif); font-size: 20px; line-height: 24px; font-weight: 500; color: var(--ink); }
  .title .month { font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
  .chip { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--hair); background: transparent; color: var(--soft); font: 500 14px/20px var(--sans); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ink); color: #1B1A17; border-color: var(--ink); }
  .textbtn { border: 0; background: transparent; color: var(--ink); font: 600 14px/20px var(--sans); padding: 0 12px; height: 40px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  .chip:focus-visible, .textbtn:focus-visible, .iconbtn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .bottom { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 8px; padding: 12px 16px 16px 16px; background: linear-gradient(rgba(7,7,10,0), rgba(7,7,10,0.92) 40%); }
  .bottom .textbtn { margin-left: auto; padding-right: 0; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--sheet); color: var(--ink); display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 16px; transform: translateY(0); transition: transform 260ms cubic-bezier(.2,.8,.2,1); box-shadow: 0 -1px 0 var(--hair); }
  .sheet[hidden] { display: flex !important; transform: translateY(110%); }
  .sheet .text { flex-grow: 1; font-size: 14px; line-height: 20px; }
  .toast { position: absolute; left: 50%; bottom: 72px; transform: translateX(-50%); background: var(--sheet); color: var(--ink); padding: 8px 14px; border-radius: 12px; font-size: 13px; line-height: 18px; box-shadow: 0 0 0 1px var(--hair); white-space: nowrap; }
  .list { position: absolute; inset: 56px 0 0 0; background: var(--night); overflow-y: auto; padding: 8px 16px 24px 16px; }
  .list h2 { font-family: var(--serif); font-size: 20px; line-height: 26px; font-weight: 500; margin: 20px 0 6px 0; color: var(--ink); }
  .list h2 span { font-family: var(--sans); font-size: 12px; line-height: 16px; color: var(--faint); margin-left: 8px; font-weight: 400; }
  .list .row { display: flex; align-items: center; gap: 10px; min-height: 44px; border-bottom: 1px solid var(--hair); cursor: pointer; }
  .list .dot { width: 8px; height: 8px; border-radius: 4px; flex: none; }
  .list .when { width: 92px; color: var(--soft); font-size: 12px; flex: none; }
  .list .what { flex-grow: 1; }
  .list .mood { color: var(--soft); font-size: 12px; }
  .hint { margin: 0; color: #6E6A78; font-size: 12px; line-height: 16px; text-align: center; max-width: 390px; }
  @media (prefers-reduced-motion: reduce) { .sheet { transition: none; } }
</style>

<div class="page">
  <div class="frame" id="frame">
    <canvas id="sky" aria-label="Your sky. Every star is something you did. The list shows the same stars as text."></canvas>
    <div class="top">
      <button class="iconbtn" id="back" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
      <div class="title"><div class="name">Your sky</div><div class="month" id="month">Everything you have marked</div></div>
      <button class="chip" id="today">Show all</button>
      <button class="textbtn" id="listbtn" aria-pressed="false">List</button>
    </div>
    <div class="list" id="list" hidden></div>
    <div class="bottom" id="bottom">
      <button class="chip" id="field" aria-pressed="true">Field</button>
      <button class="chip" id="motion" aria-pressed="true">Motion</button>
      <button class="chip" id="quiet" aria-pressed="false">Quiet sky</button>
      <button class="textbtn" id="events">Life events</button>
    </div>
    <div class="sheet" id="sheet" hidden><div class="text" id="sheettext"></div><button class="textbtn" id="open">Open it</button><button class="textbtn" id="close">Close</button></div>
    <div class="toast" id="toast" hidden></div>
  </div>
  <p class="hint">Tap a star. Drag to move, scroll or pinch to zoom, double-tap to show the whole sky. A star's place says nothing about when: the recent is blue-white, the old has redshifted and receded, and the landmarks stay.</p>
</div>

<script>
(() => {
  // ---------- the record: fourteen months, made once from a fixed seed ----------
  const KINDS = { check_in: "A check-in you logged.", practice: "A practice you used.", journal: "An entry you wrote.", goal_reached: "A goal you reached.", project_step: "A step you completed.", life_event: "A mark you placed." };
  const MOODS = ["", "Awful", "Bad", "Meh", "Good", "Rad"];
  // redshift: how far away in time a star is decides its colour. Mood never touches colour or brightness.
  const SHIFT = [[0, [196,218,255]], [0.6, [255,250,236]], [1.6, [255,226,150]], [3.2, [255,172,100]], [5.5, [255,110,88]]];
  function tintFor(age) { for (let i = 1; i < SHIFT.length; i++) { const [a0, c0] = SHIFT[i - 1], [a1, c1] = SHIFT[i]; if (age <= a1) { const t = (age - a0) / (a1 - a0); return c0.map((v, k) => Math.round(v + (c1[k] - v) * t)); } } return SHIFT[SHIFT.length - 1][1]; }
  const FADE_FLOOR = 0.22, FADE_YEARS = 2.1;   // old stars recede but never vanish; landmarks never fade
  const fadeFor = age => FADE_FLOOR + (1 - FADE_FLOOR) * Math.exp(-age / FADE_YEARS);
  const HALO = { 1: 5.6, 2: 4.9, 3: 4.2, 4: 3.7, 5: 3.2, 0: 6.5 };   // spread for hard days, gathered for good ones; a landmark is wide and bright
  const CORE = 1.9, LIGHT = 0.30 * 4.2 * 4.2;                        // same core, same total light, every star
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const TODAY = new Date(2026, 2, 14);
  const VIS = 14, YEARS = 5, ROWS = YEARS * 12 + 1;   // fourteen months fill the screen; five years are there to pull out to
  function hash(a, b) { let h = (a * 374761393 + b * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
  // The cluster field. A uniform sprinkle reads as machine-made; a real sky clumps. This warps a
  // position through lumpy value noise on a wrapping lattice. It takes a POSITION and nothing else:
  // it cannot see a record, which is the same guarantee the background field keeps, and for the
  // same reason — a warp that could see data would be a warp that could encode it.
  const LUMPS = 4, WARP = 0.13;
  const smooth = t => t * t * (3 - 2 * t);
  function noise(x, y, salt) {
    const gx = Math.floor(x * LUMPS), gy = Math.floor(y * LUMPS);
    const fx = smooth(x * LUMPS - gx), fy = smooth(y * LUMPS - gy);
    const at = (i, j) => hash(((i % LUMPS) + LUMPS) % LUMPS + salt, ((j % LUMPS) + LUMPS) % LUMPS);
    const a = at(gx, gy), b = at(gx + 1, gy), c = at(gx, gy + 1), d = at(gx + 1, gy + 1);
    return (a + (b - a) * fx) + ((c + (d - c) * fx) - (a + (b - a) * fx)) * fy;
  }
  const wrap01 = v => ((v % 1) + 1) % 1;
  const warpX = (x, y) => wrap01(x + WARP * (noise(x, y, 17) - 0.5) * 2);
  const warpY = (x, y) => wrap01(y + WARP * (noise(x, y, 91) - 0.5) * 2);

  let seed = 20260916; const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };

  const first = new Date(TODAY.getFullYear(), TODAY.getMonth() - (ROWS - 1), 1);
  const records = []; let id = 1, mood = 3;
  for (let d = new Date(first); d <= TODAY; d.setDate(d.getDate() + 1)) {
    const rough = hash(d.getFullYear(), d.getMonth() + 1) < 0.14 && d.getDate() > 5 && d.getDate() < 25;   // a quiet half-month now and then
    if (rough && rnd() < 0.72) continue;
    mood = Math.max(1, Math.min(5, mood + (rnd() < 0.5 ? -1 : 1) * (rnd() < 0.55 ? 1 : 0)));
    const day = { y: d.getFullYear(), m: d.getMonth(), d: d.getDate(), dow: d.getDay() };
    const add = (kind, mo, min) => records.push({ id: id++, kind, mood: mo, min, ...day });
    if (rnd() < 0.78) add("check_in", mood, 480 + Math.floor(rnd() * 840));
    if (rnd() < 0.22) add("check_in", Math.max(1, Math.min(5, mood + (rnd() < 0.5 ? -1 : 1))), 1200 + Math.floor(rnd() * 120));
    if (rnd() < 0.14) add("journal", mood, 1260 + Math.floor(rnd() * 90));
    if (rnd() < 0.08) add("practice", mood, 540 + Math.floor(rnd() * 600));
    if (rnd() < 0.07) add("project_step", mood, 600 + Math.floor(rnd() * 600));
  }
  // three goals reached and two marks placed, on days that have something else
  const withStars = records.filter((r, i, a) => a.findIndex(o => o.y === r.y && o.m === r.m && o.d === r.d) === i);
  for (let yi = 0; yi < YEARS; yi++) {
    for (const f of [0.22, 0.61]) { const r = withStars[Math.floor((yi + f) / YEARS * withStars.length)]; records.push({ id: id++, kind: "goal_reached", mood: r.mood, min: 1100, y: r.y, m: r.m, d: r.d, dow: r.dow }); }
    for (const f of [0.38, 0.84]) { if (hash(yi, 99) < 0.35 && f > 0.5) continue; const r = withStars[Math.floor((yi + f) / YEARS * withStars.length)]; records.push({ id: id++, kind: "life_event", mood: 0, min: 720, y: r.y, m: r.m, d: r.d, dow: r.dow }); }
  }

  // a star's position is a hash of its own identity and nothing else
  const kindIndex = k => Object.keys(KINDS).indexOf(k);
  for (const r of records) {
    const dim = new Date(r.y, r.m + 1, 0).getDate();
    // Position is a hash of the star's own identity and nothing else. Not the date, not the index,
    // not how many records exist — so a star never moves and logging today reflows nothing.
    // The two axes are drawn from separately salted mixes; the shipped app once salted AFTER the
    // mixer and got y = 1 - x exactly, which drew every month as parallel diagonal streaks.
    const hx = hash(kindIndex(r.kind) * 0x2F1B + 0x51E1, r.id);
    const hy = hash(kindIndex(r.kind) * 0x2F1B + 0x3D0A, r.id * 2654435761);
    r.x = warpX(hx, hy); r.y01 = warpY(hx, hy);
    r.rate = 3.5 + 4.5 * hash(kindIndex(r.kind) + 11, r.id * 5);   // its own beat, forever
    r.phase = 6.283 * hash(kindIndex(r.kind) + 13, r.id * 7);
    r.dim = dim;
    r.age = (TODAY - new Date(r.y, r.m, r.d)) / 31557600000;
    r.ab = Math.min(28, Math.round(r.age * 4));            // a quarter-year per sprite
    r.fade = r.kind === "life_event" ? 1 : fadeFor(r.age);
    const th = hash(kindIndex(r.kind) + 29, r.id * 19); r.tp = th < 0.30 ? 1 : th < 0.55 ? 0 : th < 0.80 ? 2 : 3;
    r.glints = r.kind === "life_event" || hash(kindIndex(r.kind) + 23, r.id * 17) < 0.22;   // only some stars ever glint
    r.gp = 7 + 15 * hash(kindIndex(r.kind) + 17, r.id * 11);   // seconds between glints
    r.go = r.gp * hash(kindIndex(r.kind) + 19, r.id * 13);     // where in that cycle it starts
  }
  records.sort((a, b) => a.row - b.row || a.d - b.d || a.min - b.min);

  // ---------- drawing ----------
  const frame = document.getElementById("frame"), canvas = document.getElementById("sky"), ctx = canvas.getContext("2d");
  let W = 390, H = 844, DPR = 1, fringe = null;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const opt = { field: true, motion: true, quiet: false };   // the app follows the phone's reduced-motion setting; the prototype starts moving so it can be judged
  const view = { z: 1, px: 0, py: 0 };          // z = 1 → fourteen months fill the height
  const ZMIN = (VIS / ROWS) * 0.9, ZMAX = 26, NIGHT = 12;
  let selected = null, anim = null, sprites = {};

  const GLOW = 1.25;   // fixed. it is a night sky, not an instrument
  const TEMPS = [[200,215,255], [255,255,255], [255,238,200], [255,214,190]];   // a star's own temperature, from its identity: icy, white, pale gold, peach
  function makeSprite(m, ab, tp, quiet) {
    const key = m + ":" + ab + ":" + tp + (quiet ? "q" : ""); if (sprites[key]) return sprites[key];
    const land = m === 0, hr = HALO[m] * GLOW, peak = land ? 0.5 : LIGHT / (HALO[m] * HALO[m]);
    const R = hr * (land ? 2.2 : 1.3), size = Math.ceil(R * 2) + 2, core = land ? 2.2 : 1.15;
    const c = document.createElement("canvas"); c.width = c.height = size * DPR; const g = c.getContext("2d"); g.scale(DPR, DPR);
    let [Rc, Gc, Bc] = land ? [255,255,255] : tintFor(ab / 4);
    if (!land) { const T = TEMPS[tp]; Rc = Math.round(Rc * 0.65 + T[0] * 0.35); Gc = Math.round(Gc * 0.65 + T[1] * 0.35); Bc = Math.round(Bc * 0.65 + T[2] * 0.35); }
    const a = al => `rgba(${Rc},${Gc},${Bc},${Math.max(0, Math.min(1, al)).toFixed(3)})`, cx = size / 2;
    if (!quiet) {
      if (land) {   // four soft spikes, the way a bright star flares in the eye
        for (const rot of [0, Math.PI / 2]) {
          g.save(); g.translate(cx, cx); g.rotate(rot);
          const sp = g.createLinearGradient(-R, 0, R, 0);
          sp.addColorStop(0, "rgba(255,255,255,0)"); sp.addColorStop(0.5, "rgba(255,255,255,0.6)"); sp.addColorStop(1, "rgba(255,255,255,0)");
          g.fillStyle = sp; g.fillRect(-R, -0.6, 2 * R, 1.2); g.restore();
        }
      }
      const k = peak + 0.3;   // the outer glow: soft and faint, spread by the mood
      const outer = g.createRadialGradient(cx, cx, core, cx, cx, R);
      outer.addColorStop(0, a(0.5 * k)); outer.addColorStop(0.18, a(0.34 * k)); outer.addColorStop(0.45, a(0.12 * k)); outer.addColorStop(0.75, a(0.035 * k)); outer.addColorStop(1, a(0));
      g.fillStyle = outer; g.beginPath(); g.arc(cx, cx, R, 0, 7); g.fill();
      const inner = g.createRadialGradient(cx, cx, 0, cx, cx, core + 1.5);   // the inner glow: tight and bright, right against the point
      inner.addColorStop(0, a(0.95)); inner.addColorStop(0.5, a(0.55)); inner.addColorStop(1, a(0));
      g.fillStyle = inner; g.beginPath(); g.arc(cx, cx, core + 1.5, 0, 7); g.fill();
    }
    g.fillStyle = "rgb(255,253,247)"; g.beginPath(); g.arc(cx, cx, quiet ? core + 0.5 : core, 0, 7); g.fill();   // the point: hard-edged and crisp
    return (sprites[key] = { c, size });
  }
  function makeFringe() {   // the two halves of a prism flash: a red glow and a blue one, added to the star for a moment
    const mk = (R, G, B) => { const rad = (CORE + 1.6) * GLOW, size = Math.ceil(rad * 2) + 2, c = document.createElement("canvas"); c.width = c.height = size * DPR; const g = c.getContext("2d"); g.scale(DPR, DPR);
      const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, rad); gr.addColorStop(0, `rgba(${R},${G},${B},0.9)`); gr.addColorStop(0.5, `rgba(${R},${G},${B},0.35)`); gr.addColorStop(1, `rgba(${R},${G},${B},0)`);

  }
  // One open field. There are no rows and no months: a star's place says nothing about when.
  const fieldW = () => W * view.z, fieldH = () => H * view.z;

  }
  function fieldTile(tx, ty) {
    const out = []; const n = 26;

    }
    return out;
  }
  const tiles = new Map();
  function drawField(t) {
    const par = 0.35, size = 110;                     // the field moves slower than the stars: depth, not data
    const ox = view.px * par, oy = view.py * par;
    // A faint wash for depth. It used to be one nebula per year, back when a year was a band of
    // the field. Years are not places any more, so this is simply sky: fixed, seeded once, and
    // moving with the field rather than with the data.
    for (const [wx, wy, rad, col] of [[0.24, 0.30, 0.55, "120,140,205"], [0.78, 0.66, 0.60, "225,180,150"], [0.52, 1.02, 0.45, "140,150,210"]]) {
      const gx = wx * W + ox * 0.6, gy = wy * H + oy * 0.6, rr = rad * Math.max(W, H);
      const wash = ctx.createRadialGradient(gx, gy, 0, gx, gy, rr);
      wash.addColorStop(0, `rgba(${col},0.075)`); wash.addColorStop(0.55, `rgba(${col},0.03)`); wash.addColorStop(1, `rgba(${col},0)`);

  }
  function glyph(r, x, y) {   // the marks for kind, drawn only when leaned in to one day
    const [R, G, B] = r.kind === "life_event" ? [255,255,255] : tintFor(r.age); ctx.strokeStyle = `rgba(${R},${G},${B},0.7)`; ctx.fillStyle = ctx.strokeStyle; ctx.lineWidth = 1;
    if (r.kind === "goal_reached") { ctx.beginPath(); ctx.moveTo(x - 5, y); ctx.lineTo(x + 5, y); ctx.moveTo(x, y - 5); ctx.lineTo(x, y + 5); ctx.stroke(); }
    else if (r.kind === "project_step") { ctx.fillRect(x - 5.5, y - 0.5, 3, 1); }
    else if (r.kind === "journal") { ctx.fillRect(x - 2.6, y + 3.5, 5.2, 1); }
    else if (r.kind === "practice") { ctx.beginPath(); ctx.arc(x, y, 3.2, 0, 7); ctx.stroke(); }
    else if (r.kind === "life_event") { ctx.beginPath(); ctx.moveTo(x - 9.5, y); ctx.lineTo(x + 9.5, y); ctx.moveTo(x, y - 9.5); ctx.lineTo(x, y + 9.5); ctx.stroke(); ctx.strokeStyle = `rgba(${R},${G},${B},0.35)`; ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.stroke(); }
  }
  function draw(t) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = "#07070A"; ctx.fillRect(0, 0, W, H);
    if (opt.field && !opt.quiet) drawField(t);
    const night = view.z >= NIGHT;   // kind marks resolve only when you lean all the way in
    for (const r of records) {
      const x = sx(r), y = sy(r); if (x < -20 || x > W + 20 || y < -20 || y > H + 20) continue;
      const slow = 0.5 + 0.5 * Math.sin(t / (r.rate * 1000) * 6.283 + r.phase);
      const quick = r.phase > 4.2 ? 0.5 + 0.5 * Math.sin(t / 260 + r.phase * 5) : 0.5;   // a third of them shimmer as well
      const a = opt.motion ? 1 - (0.22 * (1 - slow) + 0.05 * (1 - quick)) : 1;
      const grow = opt.motion ? 1 + 0.04 * (slow - 0.5) : 1;
      const s = makeSprite(r.mood, r.ab, r.tp, opt.quiet);
      const dx = x, dy = y;
      const gs = s.size * grow; ctx.globalAlpha = a * r.fade; ctx.drawImage(s.c, dx - gs / 2, dy - gs / 2, gs, gs); ctx.globalAlpha = 1;
      if (opt.motion && r.glints && !opt.quiet) {   // the prism: brief, rare, and added on top so the star itself never changes colour
        const gt = (t / 1000 + r.go) % r.gp, env = gt < 0.28 ? Math.sin(Math.PI * gt / 0.28) : 0;
        if (env > 0) {
          if (!fringe) fringe = makeFringe();
          const land = r.kind === "life_event", off = (land ? 1.6 : 0.8) * env, fs = fringe.r.size * (land ? 1.8 : 1);
          ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = (land ? 0.5 : 0.34) * env * r.fade;
          ctx.drawImage(fringe.r.c, dx - off - fs / 2, dy - fs / 2, fs, fs); ctx.drawImage(fringe.b.c, dx + off - fs / 2, dy - fs / 2, fs, fs);
          ctx.globalAlpha = (land ? 0.3 : 0.16) * env * r.fade; ctx.drawImage(s.c, dx - gs / 2, dy - gs / 2, gs, gs);
          ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
        }
      }
      if (night) glyph(r, dx, dy);
      if (r === selected) { ctx.strokeStyle = "rgba(235,229,216,0.9)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(dx, dy, 9, 0, 7); ctx.stroke(); }
    }
    // Nothing labels the field. No part of it is a date, so any label would be a claim that is
    // not true, and a wrong date here is worse than none. Dates live in the list.
  }
  const pad = min => `${String(Math.floor(min / 60)).padStart(2, "0")}:${String(min % 60).padStart(2, "0")}`;
  function loop(t) { if (anim) { const k = Math.min(1, (t - anim.t0) / anim.ms), e = 1 - Math.pow(1 - k, 3); view.z = anim.z0 + (anim.z1 - anim.z0) * e; view.px = anim.px0 + (anim.px1 - anim.px0) * e; view.py = anim.py0 + (anim.py1 - anim.py0) * e; if (k >= 1) anim = null; } clamp(); draw(t); requestAnimationFrame(loop); }
  let started = false;
  function resize() { const r = frame.getBoundingClientRect(); W = r.width; H = r.height; DPR = Math.min(3, devicePixelRatio || 1); fringe = null; canvas.width = W * DPR; canvas.height = H * DPR; sprites = {}; if (!started) { started = true; } clamp(); }
  new ResizeObserver(resize).observe(frame); resize(); requestAnimationFrame(loop);

  // ---------- moving through it ----------
  function zoomAt(fx, fy, z1) { z1 = Math.max(ZMIN, Math.min(ZMAX, z1)); const k = z1 / view.z; view.px = fx - (fx - view.px) * k; view.py = fy - (fy - view.py) * k; view.z = z1; clamp(); }
  function animateTo(z1, px1, py1) { if (reduced || !opt.motion) { view.z = z1; view.px = px1; view.py = py1; clamp(); return; } anim = { t0: performance.now(), ms: 480, z0: view.z, z1, px0: view.px, px1, py0: view.py, py1 }; }
  function showAll() { selected = null; sheet.hidden = true; animateTo(1, 0, 0); }
  function leanIn(r) {
    // Selecting a star no longer moves the view to a day, because a day is not a place. It marks
    // the star and names it. The zoom stays where the person put it.
    selected = r;
    const when = `${DAYS[r.dow]} ${r.d} ${MONTHS[r.m].slice(0, 3)} ${r.y}, ${pad(r.min)}`;
    sheettext.textContent = `${KINDS[r.kind]} ${when}${r.mood ? " · " + MOODS[r.mood] : ""}`;
    openbtn.hidden = r.kind === "project_step"; sheet.hidden = false;
  }
  function hit(x, y) {
    let best = null, bd = 24;
    for (const r of records) { const d = Math.hypot(sx(r) - x, sy(r) - y); if (d < bd) { bd = d; best = r; } }
    return best;
  }
  const sheet = document.getElementById("sheet"), sheettext = document.getElementById("sheettext"), openbtn = document.getElementById("open");
  const ptrs = new Map(); let drag = null, lastTap = 0, pinch = null;
  canvas.addEventListener("pointerdown", e => {
    canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
    if (ptrs.size === 1) drag = { x: e.offsetX, y: e.offsetY, px: view.px, py: view.py, moved: false, t: performance.now() };
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: view.z }; drag = null; }
  });
  canvas.addEventListener("pointermove", e => {
    if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
    if (pinch && ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, pinch.z * d / pinch.d); return; }
    if (drag) { const dx = e.offsetX - drag.x, dy = e.offsetY - drag.y; if (Math.hypot(dx, dy) > 6) drag.moved = true; if (drag.moved) { anim = null; view.px = drag.px + dx; view.py = drag.py + dy; clamp(); } }
  });
  canvas.addEventListener("pointerup", e => {
    ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null;
    if (drag && !drag.moved && performance.now() - drag.t < 400) {
      const now = performance.now();
      if (now - lastTap < 300) { lastTap = 0; showAll(); }
      else { lastTap = now; const r = hit(e.offsetX, e.offsetY); if (r) leanIn(r); else if (selected) { selected = null; sheet.hidden = true; } }
    }
    drag = null;
  });
  canvas.addEventListener("pointercancel", e => { ptrs.delete(e.pointerId); drag = null; pinch = null; });
  canvas.addEventListener("wheel", e => { e.preventDefault(); anim = null; zoomAt(e.offsetX, e.offsetY, view.z * Math.exp(-e.deltaY * 0.0018)); }, { passive: false });

  // ---------- the controls, as on the real screen ----------
  const toast = document.getElementById("toast"); let toastT = 0;
  const say = s => { toast.textContent = s; toast.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { toast.hidden = true; }, 1800); };
  const press = (el, on) => el.setAttribute("aria-pressed", on ? "true" : "false");
  document.getElementById("today").addEventListener("click", showAll);
  document.getElementById("field").addEventListener("click", e => { opt.field = !opt.field; press(e.currentTarget, opt.field); });
  document.getElementById("motion").addEventListener("click", e => { opt.motion = !opt.motion; press(e.currentTarget, opt.motion); });
  document.getElementById("quiet").addEventListener("click", e => { opt.quiet = !opt.quiet; press(e.currentTarget, opt.quiet); if (opt.quiet) { opt.field = false; press(document.getElementById("field"), false); } });
  document.getElementById("events").addEventListener("click", () => say("Opens the life events screen"));
  document.getElementById("back").addEventListener("click", () => say("Back to Home"));
  openbtn.addEventListener("click", () => say(selected && selected.kind === "life_event" ? "Opens that mark" : "Opens the entry"));
  document.getElementById("close").addEventListener("click", () => { selected = null; sheet.hidden = true; });

  // the list: the same stars as text, a peer and not a fallback
  const list = document.getElementById("list"), listbtn = document.getElementById("listbtn");
  function buildList() {
    // The month comes off the star's own date now, not off a row, because there are no rows. This
    // is the only place in the product where a date is a heading, and it matters more than it used
    // to: with the field scattered, the list is the ONLY way to reach a particular day.
    const monthKey = r => r.y * 12 + r.m;
    let html = "", cur = -1;
    const byRow = [...records].sort((a, b) => monthKey(a) - monthKey(b) || a.d - b.d || a.min - b.min);
    for (const r of byRow) {
      if (monthKey(r) !== cur) {
        cur = monthKey(r);
        const n = byRow.filter(o => monthKey(o) === cur).length;
        html += `<h2>${MONTHS[r.m]} ${r.y}<span>${n} items</span></h2>`;
      }
      const [R, G, B] = r.kind === "life_event" ? [255,255,255] : tintFor(r.age);
      html += `<div class="row" data-id="${r.id}"><div class="dot" style="background: rgb(${R},${G},${B}); opacity: ${r.fade.toFixed(2)};"></div><div class="when">${DAYS[r.dow]} ${r.d} ${MONTHS[r.m].slice(0,3)} · ${pad(r.min)}</div><div class="what">${KINDS[r.kind].replace(/\.$/, "")}</div><div class="mood">${r.mood ? MOODS[r.mood] : ""}</div></div>`;
    }
    list.innerHTML = html;
    list.querySelectorAll(".row").forEach(el => el.addEventListener("click", () => { const r = records.find(o => o.id === +el.dataset.id); list.hidden = true; listbtn.textContent = "List"; press(listbtn, false); leanIn(r); }));
  }
  buildList();
  listbtn.addEventListener("click", () => { const show = list.hidden; list.hidden = !show; listbtn.textContent = show ? "Sky" : "List"; press(listbtn, show); document.getElementById("bottom").hidden = show; if (show) { sheet.hidden = true; selected = null; } });
})();
</script>
