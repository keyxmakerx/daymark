name: Companion

# CI for the self-hosted Companion (companion/). Two gates first — type-check the web
# bundle and test the server — then, only if both pass, build the Docker image and boot it
# under its hardened settings, twice: once through docker-compose.yml (host-proxy topology,
# published loopback port) and once with docker-compose.no-egress.yml (container-proxy
# topology, no published port). Both are probed for the security properties their comments
# claim, because an untested claim in a compose file is how the last four first-boot
# failures shipped green.
#
# Path-filtered so it only runs when companion code (or this workflow) changes; the
# Android app build lives in build.yml.

# PUSH ONLY, for the same reason as build.yml: `push` and `pull_request` both fire for a branch
# with an open PR, and a check run attaches to the head commit either way, so the pair produced two
# identical runs of every job here — including the Docker build and both compose boots, which are
# the most expensive jobs in the repository. A PR from a fork would get no checks; that is the
# accepted trade, recorded in build.yml.
on:
  push:
    branches: ["**"]
    paths:
      - "companion/**"
      - ".github/workflows/companion.yml"
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch NAME, not `github.ref`. With both triggers enabled this group could never
# collapse a duplicate anyway — `github.ref` is `refs/heads/<branch>` for a push but
# `refs/pull/<n>/merge` for a pull request — so the two runs simply sat in different groups and both
# ran to completion. With one trigger the distinction is moot, and `ref_name` is the clearer key.
#
# `main` is exempt from cancellation: every commit on the default branch keeps its own verdict.
concurrency:
  group: companion-${{ github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  web:
    name: Web — type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: companion/web/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # `pnpm build` runs svelte-check (type-check) and then the Vite production build.
      - name: Type-check + build
        run: pnpm build

      - name: Unit tests (crypto + instrument honesty gate + tasks)
        run: pnpm test:unit

      - name: Upload web bundle
        uses: actions/upload-artifact@v7
        with:
          name: companion-web-dist
          path: companion/web/dist
          if-no-files-found: error

  server:
    name: Server — test + jar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion/server
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # "Which Netty are we actually on?" was unanswerable from the repo — there is no lockfile
      # and no verification metadata, so the audit had to mark its own premise unverified. It is a
      # transitive of Ktor, which means a Ktor downgrade, a resolution rule, or a new dependency
      # dragging in an older codec can all put it back under the CVE line silently. Assert it.
      #
      # CVE-2025-58056 (bare-LF chunk terminator), CVE-2025-67735 (CRLF in request URI) and
      # CVE-2026-42587 (decompression bomb bypassing maxAllocation) are all fixed at or below
      # 4.2.13.Final. Ktor 3.5.2 currently brings 4.2.16.Final.
      - name: Resolved Netty must be at or above the CVE fixes
        run: |
          set -euo pipefail
          ./gradlew -q dependencies --configuration runtimeClasspath > /tmp/deps.txt || true
          echo "== resolved netty artifacts =="
          grep -oE 'io\.netty:netty-[a-z0-9-]+:[0-9]+\.[0-9]+\.[0-9]+' /tmp/deps.txt | sort -u || true

          # Non-vacuous: if Netty is absent from the graph the grep would find nothing and a naive
          # check would "pass". Netty is not optional here — ktor-server-netty is the engine.
          found=$(grep -oE 'io\.netty:netty-codec-http:[0-9]+\.[0-9]+\.[0-9]+' /tmp/deps.txt \
                  | head -1 | cut -d: -f3 || true)
          if [ -z "$found" ]; then
            echo "::error::netty-codec-http not found in runtimeClasspath — the check cannot mean anything"
            exit 1
          fi

          min=4.2.13
          lowest=$(printf '%s\n%s\n' "$found" "$min" | sort -V | head -1)
          if [ "$lowest" != "$min" ] && [ "$found" != "$min" ]; then
            echo "::error::netty-codec-http $found is BELOW $min — reintroduces CVE-2025-58056 / CVE-2025-67735 / CVE-2026-42587"
            exit 1
          fi
          echo "netty-codec-http $found >= $min"

      - name: Run tests
        run: ./gradlew test --stacktrace

      - name: Build fat jar
        run: ./gradlew shadowJar --stacktrace

      - name: Upload server jar
        uses: actions/upload-artifact@v7
        with:
          name: companion-server-jar
          path: companion/server/build/libs/daymark-companion.jar
          if-no-files-found: error

  integration:
    name: Sync integration (real server + crypto)
    runs-on: ubuntu-latest
    needs: [server] # the server job builds the jar this drives
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download server jar
        uses: actions/download-artifact@v4
        with:
          name: companion-server-jar
          path: companion/server/build/libs

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: companion/web/pnpm-lock.yaml

      - name: Install web deps
        working-directory: companion/web
        run: pnpm install --frozen-lockfile

      # Boots the jar and round-trips encrypt → PUT → fetch → decrypt through the API.
      - name: Run integration tests
        working-directory: companion/web
        env:
          DAYMARK_SERVER_JAR: ${{ github.workspace }}/companion/server/build/libs/daymark-companion.jar
        run: pnpm test:integration

  docker:
    name: Docker — image + both compose topologies
    runs-on: ubuntu-latest
    needs: [web, server] # only spin up the builder once the checks above pass
    permissions:
      contents: read
      packages: write # publish to GHCR; see the final step
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: companion
          file: companion/Dockerfile
          push: false
          load: true
          tags: daymark-companion:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container and smoke-test
        run: |
          set -euo pipefail
          # Run under the same hardening the compose file uses: non-root (baked into the
          # image), read-only rootfs + tmpfs /tmp, all caps dropped, no new privileges.
          # /data needs a real volume: the rootfs is read-only, and the HEALTHCHECK probes
          # /readyz, which writes there. Without it the container is correctly unhealthy —
          # which is the point of that probe, but not what this step is testing.
          docker volume create companion-ci-data >/dev/null
          docker run -d --name companion \
            -p 127.0.0.1:8080:8080 \
            --read-only --tmpfs /tmp \
            -v companion-ci-data:/data \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            daymark-companion:ci

          echo "Waiting for the container to become healthy..."
          ok=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "::error::container did not answer /healthz in time"
            docker logs companion || true
            exit 1
          fi

          echo "== /healthz =="
          curl -fsS http://127.0.0.1:8080/healthz; echo

          echo "== /readyz proves the data volume is writable =="
          curl -fsS http://127.0.0.1:8080/readyz | grep -q '"ok":true' \
            || { echo "::error::/readyz did not report ready with a writable /data"; \
                 docker logs companion || true; exit 1; }

          echo "== security header present =="
          curl -fsS -D - -o /dev/null http://127.0.0.1:8080/ \
            | grep -i "content-security-policy: default-src 'self'" \
            || { echo "::error::CSP header missing/incorrect"; exit 1; }

          echo "== app is served =="
          curl -fsS http://127.0.0.1:8080/ | grep -q "Daymark Companion" \
            || { echo "::error::report viewer not served at /"; exit 1; }

          # The checks above curl from the HOST, which passes even if the image's own
          # HEALTHCHECK is broken. That matters on distroless: shell-form HEALTHCHECK is
          # wrapped in /bin/sh, which does not exist there, so the probe cannot execute at
          # all and the container pins "unhealthy" forever. Docker never restarts a
          # container for being unhealthy on a single host, so nothing would ever say so.
          echo "== container reports healthy (proves the HEALTHCHECK binary actually runs) =="
          st=none
          for _ in $(seq 1 45); do
            st=$(docker inspect -f '{{.State.Health.Status}}' companion 2>/dev/null || echo none)
            [ "$st" = "healthy" ] && break
            [ "$st" = "unhealthy" ] && break
            sleep 2
          done
          if [ "$st" != "healthy" ]; then
            echo "::error::HEALTHCHECK never reported healthy (status=$st)"
            docker inspect -f '{{json .State.Health}}' companion || true
            docker logs companion || true
            exit 1
          fi

          # And the inverse: with /data NOT writable, /readyz must say so. This is the whole
          # reason the endpoint exists — the old /healthz returned 200 in exactly this state,
          # so a container that could not accept a single write reported perfect health.
          echo "== /readyz fails when /data is read-only =="
          docker rm -f companion >/dev/null
          docker run -d --name companion-ro \
            -p 127.0.0.1:8081:8080 \
            --read-only --tmpfs /tmp \
            -v companion-ci-data:/data:ro \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            daymark-companion:ci
          for _ in $(seq 1 40); do
            curl -fsS --max-time 2 http://127.0.0.1:8081/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:8081/healthz >/dev/null \
            || { echo "::error::liveness should still pass with a read-only /data"; \
                 docker logs companion-ro || true; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8081/readyz)
          if [ "$code" != "503" ]; then
            echo "::error::/readyz returned $code with a read-only /data; expected 503"
            docker logs companion-ro || true
            exit 1
          fi
          docker logs companion-ro 2>&1 | grep -q 'NOT READY' \
            || { echo "::error::readiness failure was not logged"; docker logs companion-ro || true; exit 1; }

          docker rm -f companion-ro >/dev/null
          docker volume rm companion-ci-data >/dev/null
          echo "Container smoke-test passed."

      # Everything above tests the IMAGE. Nothing tested the deployment — and a security
      # audit found four independent first-boot failures that all lived in the compose
      # file, which CI had never parsed, let alone run. The steps below exist so that
      # class of bug cannot ship green again, and so that the security claims written in
      # the compose comments are claims CI can contradict.
      - name: Compose — prepare .env and the auth secret
        working-directory: companion
        run: |
          set -euo pipefail
          cp .env.example .env
          mkdir -p secrets
          openssl rand -base64 48 | tr -d '\n' > secrets/auth_token
          # Compose ignores the secrets uid/gid/mode keys outside Swarm, so the container
          # sees the HOST file's ownership. Left root:root, UID 65532 cannot read it.
          sudo chown 65532:65532 secrets/auth_token
          sudo chmod 400 secrets/auth_token
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.no-egress.yml config --quiet
          # Pull the probe image once; both topology tests use it.
          docker pull -q alpine:3

      - name: Compose — default topology boots, publishes, and cannot phone home
        working-directory: companion
        run: |
          set -euo pipefail
          # Boots the app through the REAL compose file, so the hardening actually applies:
          # the noexec tmpfs (which blocks sqlite-jdbc's JNI extraction unless
          # org.sqlite.tmpdir points elsewhere) and the docker secret above.
          docker compose up -d --build companion

          st=none
          for _ in $(seq 1 60); do
            st=$(docker inspect -f '{{.State.Health.Status}}' daymark-companion 2>/dev/null || echo none)
            [ "$st" = "healthy" ] && break
            [ "$st" = "unhealthy" ] && break
            sleep 2
          done
          if [ "$st" != "healthy" ]; then
            echo "::error::compose deployment never became healthy (status=$st)"
            docker compose logs companion || true
            docker compose down -v || true
            exit 1
          fi

          # THE claim this topology rests on. Published ports do NOT work on Docker
          # `internal:` networks (moby/moby#36174), which is why the default network is a
          # plain bridge with masquerading off rather than an internal one. If that ever
          # stops being true, every bring-your-own-proxy deployment silently loses its
          # only ingress path, so prove it on every run rather than trusting the comment.
          echo "== the published loopback port actually serves =="
          curl -fsS --max-time 10 http://127.0.0.1:8080/healthz | grep -q '"ok":true' \
            || { echo "::error::published port 127.0.0.1:8080 did not serve /healthz"; \
                 docker compose logs companion || true; docker compose down -v || true; exit 1; }

          # The other half of that trade: no NAT for outbound, so egress does not complete.
          # Tested from a probe container on the same network, because egress is a property
          # of the network and the app image has no shell to test from.
          #
          # NON-VACUOUS FIRST. A bare `if docker run … wget 1.1.1.1; then fail; fi` reports
          # success whenever `docker run` exits non-zero for ANY reason — image missing,
          # bad network name, wget flag unsupported, daemon hiccup. It cannot tell "egress
          # is blocked" from "the probe never ran", which is the same failure the INTERNET
          # check in build.yml guards against and which this step shipped with anyway. So
          # prove the probe works on this network before trusting its negative.
          echo "== the network has no working egress =="
          net="$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}' daymark-companion)"
          docker run --rm --network "$net" alpine:3 \
            wget -q -T 10 -O /dev/null http://daymark-companion:8080/healthz \
            || { echo "::error::the egress probe cannot reach the app on $net, so its result would prove nothing"; \
                 docker compose logs companion || true; docker compose down -v || true; exit 1; }
          if docker run --rm --network "$net" alpine:3 \
               wget -q -T 6 -O /dev/null http://1.1.1.1/ 2>/dev/null; then
            echo "::error::egress SUCCEEDED from the app network — enable_ip_masquerade:false is not holding, and the compose comment claiming no egress is wrong"
            docker compose down -v || true
            exit 1
          fi
          echo "egress blocked as designed (and the probe was proven able to run)."

          # The trusted-proxy contract's silent failure mode, made loud. .env ships with
          # DAYMARK_TRUSTED_PROXIES empty, so a forwarded header must produce exactly one
          # warning naming the address the app saw.
          echo "== a forwarded header with an empty allowlist warns =="
          curl -fsS --max-time 10 -H 'X-Forwarded-For: 203.0.113.9' http://127.0.0.1:8080/healthz >/dev/null
          sleep 2
          docker compose logs companion 2>&1 | grep -q 'X-Forwarded-For' \
            || { echo "::error::no trusted-proxy misconfiguration warning was logged"; \
                 docker compose logs companion || true; docker compose down -v || true; exit 1; }

          echo "Default topology verified."
          docker compose down -v

      - name: Compose — no-egress override serves a proxy container, and only that
        working-directory: companion
        run: |
          set -euo pipefail
          # The topology for a CONTAINERISED proxy (Cosmos Cloud's normal mode, Traefik,
          # NPM): no published port, `internal: true` + gateway_mode isolated, and the
          # proxy joins the app's network. Untested, this is exactly the config that boots
          # fine and is unreachable — so CI stands in for the proxy.
          docker compose -f docker-compose.yml -f docker-compose.no-egress.yml up -d --build companion

          st=none
          for _ in $(seq 1 60); do
            st=$(docker inspect -f '{{.State.Health.Status}}' daymark-companion 2>/dev/null || echo none)
            [ "$st" = "healthy" ] && break
            [ "$st" = "unhealthy" ] && break
            sleep 2
          done
          if [ "$st" != "healthy" ]; then
            echo "::error::no-egress deployment never became healthy (status=$st)"
            docker compose -f docker-compose.yml -f docker-compose.no-egress.yml logs companion || true
            docker compose -f docker-compose.yml -f docker-compose.no-egress.yml down -v || true
            exit 1
          fi

          net="$(docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}' daymark-companion)"

          # A proxy attached to this network must reach the app BY CONTAINER NAME — that is
          # the upstream address the docs tell operators to configure, and it depends on
          # Docker's embedded DNS still working on a gateway-less network.
          echo "== a container on the network reaches the app by name =="
          docker run --rm --network "$net" alpine:3 \
            wget -q -T 10 -O- http://daymark-companion:8080/healthz | grep -q '"ok":true' \
            || { echo "::error::a proxy container on $net cannot reach http://daymark-companion:8080"; \
                 docker compose -f docker-compose.yml -f docker-compose.no-egress.yml logs companion || true; \
                 docker compose -f docker-compose.yml -f docker-compose.no-egress.yml down -v || true; exit 1; }

          # Non-vacuous by construction here: the check above already proved a probe container
          # runs on this network and reaches the app, so a failure below is about egress.
          echo "== and still has no egress =="
          if docker run --rm --network "$net" alpine:3 \
               wget -q -T 6 -O /dev/null http://1.1.1.1/ 2>/dev/null; then
            echo "::error::egress SUCCEEDED from an internal+isolated network"
            docker compose -f docker-compose.yml -f docker-compose.no-egress.yml down -v || true
            exit 1
          fi

          # `!reset` on ports is what removes the binding the base file declares. If the
          # override syntax ever silently stops applying, the port comes back and the
          # "no host exposure" claim is void — so assert the absence directly.
          echo "== no host port is published =="
          published="$(docker inspect -f '{{json .NetworkSettings.Ports}}' daymark-companion)"
          if [ "$published" != "{}" ] && echo "$published" | grep -q 'HostPort'; then
            echo "::error::no-egress override still published a host port: $published"
            docker compose -f docker-compose.yml -f docker-compose.no-egress.yml down -v || true
            exit 1
          fi

          echo "No-egress topology verified."
          docker compose -f docker-compose.yml -f docker-compose.no-egress.yml down -v

      # ── Publish ────────────────────────────────────────────────────────────
      # Deliberately the LAST steps in this job, not a separate one. Everything above has to
      # pass first — the image serves /healthz and /readyz under the real hardening, both
      # compose topologies boot, egress is dead, the no-egress override really removes the
      # host binding. Only then does it become something anyone can `docker pull`. A publish
      # job that merely `needs:` this one would have to rebuild, and a rebuilt image is not
      # the artefact that was tested.
      #
      # main and manual dispatch only. Never on pull_request: that would publish code from a
      # fork under this repository's name, before review.
      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image to GHCR
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          set -euo pipefail
          # GHCR rejects uppercase in the path, and a GitHub owner may legitimately contain
          # capitals, so normalise rather than assume.
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/daymark-companion"
          sha="${{ github.sha }}"
          short="sha-${sha:0:12}"

          # Two tags with different jobs. `sha-<commit>` is immutable and is what a deployment
          # should reference: it can never become a different build under you. `main` is a
          # convenience pointer for "whatever is current" and is exactly the moving-tag pattern
          # that makes an auto-updating container change behaviour overnight — so it exists, and
          # the docs tell you not to deploy it.
          docker tag daymark-companion:ci "$image:$short"
          docker tag daymark-companion:ci "$image:main"
          docker push "$image:$short"
          docker push "$image:main"

          # The digest is the only reference that is both immutable AND verifiable — a tag can be
          # force-pushed, a digest cannot. It also closes a real gap: this repo pins its base
          # images by digest but has never published one of its own, so "is the running image the
          # one CI tested?" was unanswerable. Now it is.
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image:$short" 2>/dev/null || true)
          if [ -z "$digest" ]; then
            echo "::error::pushed but could not read back a RepoDigest — do not treat this image as pinned"
            exit 1
          fi

          {
            echo "### Published"
            echo
            echo '```'
            echo "$image:$short"
            echo "$digest"
            echo '```'
            echo
            echo "Deploy the digest, or the \`$short\` tag. Not \`:main\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "published $digest"
