name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Skip setup-android's default "tools" (legacy Android SDK Tools) package: it drags
          # in the ~1GB emulator, whose download intermittently corrupts ("Error reading Zip
          # content from a SeekableByteChannel") and which this headless build never uses.
          # Install only what the build needs, up front, so it can't flake on the emulator.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APKs (foss + sync flavors)
        run: ./gradlew assembleDebug --stacktrace

      - name: Compile instrumented tests
        # Neither `test` nor `assembleDebug` compiles androidTest sources, so without this a broken
        # MigrationTest.kt would sail through CI untouched. This does NOT run the tests — they need
        # a device — but it does prove they still compile against the current schema and DAOs.
        run: ./gradlew assembleFossDebugAndroidTest --stacktrace

      - name: Fail if the exported Room schemas drifted from what is committed
        # Worth more than it looks. Room's own equality check (DatabaseBundle.isSchemaEqual)
        # compares ONLY entities and views — never identityHash, version, or setupQueries — so a
        # committed schema carrying a wrong identityHash would be invisible to every build. This
        # step is the only thing that would catch it, and it also catches an entity change that
        # forgot to bump the version.
        run: git diff --exit-code -- app/schemas

      - name: Install build-tools (for aapt2)
        run: sdkmanager --install "build-tools;35.0.0"

      - name: Verify the foss flavor never declares INTERNET
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          AAPT2="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -name aapt2 -type f | sort -V | tail -1)"
          if [ -z "$AAPT2" ]; then
            echo "::error::could not locate aapt2 under $SDK_ROOT/build-tools"
            exit 1
          fi
          PERMS=$("$AAPT2" dump permissions app/build/outputs/apk/foss/debug/app-foss-debug.apk)
          echo "$PERMS"
          if echo "$PERMS" | grep -q "android.permission.INTERNET"; then
            echo "::error::the foss flavor must stay network-free — INTERNET leaked into its merged manifest"
            exit 1
          fi

      - name: Upload foss debug APK
        uses: actions/upload-artifact@v7
        with:
          name: daymark-foss-debug
          path: app/build/outputs/apk/foss/debug/app-foss-debug.apk
          if-no-files-found: error

      - name: Upload sync debug APK
        uses: actions/upload-artifact@v7
        with:
          name: daymark-sync-debug
          path: app/build/outputs/apk/sync/debug/app-sync-debug.apk
          if-no-files-found: error
