name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Least privilege, matching companion.yml and release.yml. Without this the workflow inherits the
# repository default, which may be read/write — more than a build that only reads code and uploads
# artifacts ever needs.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Skip setup-android's default "tools" (legacy Android SDK Tools) package: it drags
          # in the ~1GB emulator, whose download intermittently corrupts ("Error reading Zip
          # content from a SeekableByteChannel") and which this headless build never uses.
          # Install only what the build needs, up front, so it can't flake on the emulator.
          # android-36 + build-tools 36.0.0 are staged ahead of the compileSdk 36 bump and of
          # AGP 9 (which requires build-tools >= 36.0.0). Installing them now costs nothing and
          # removes a variable from those changes.
          packages: "platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Configuration-only gate, ~90s. Plugin resolution, DSL and version-catalog failures land
      # here instead of after a 7-minute assemble. Cheap attribution is the scarce resource in
      # this repo: there is no Android SDK on the dev machine, so CI is the only oracle and every
      # round costs 7 minutes.
      - name: Configuration smoke test
        run: |
          ./gradlew help --stacktrace
          ./gradlew build --dry-run --stacktrace

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APKs (foss + sync flavors)
        run: ./gradlew assembleDebug --stacktrace

      # R8 and resource shrinking run ONLY on release variants, which until now were built only
      # on a tag push — so a minification failure surfaced at release time, outside the feedback
      # loop entirely. That is the worst possible place to find it. The `sync` flavor matters
      # most: JNA binds native methods reflectively, so its keep rules are exactly the kind R8
      # breaks silently. Both flavors, because only `sync` pulls in JNA.
      - name: Build release APKs (exercises R8 + resource shrinking)
        run: ./gradlew assembleFossRelease assembleSyncRelease --stacktrace

      - name: Compile instrumented tests
        # Neither `test` nor `assembleDebug` compiles androidTest sources, so without this a broken
        # MigrationTest.kt would sail through CI untouched. This does NOT run the tests — they need
        # a device — but it does prove they still compile against the current schema and DAOs.
        run: ./gradlew assembleFossDebugAndroidTest --stacktrace

      - name: Install build-tools (for aapt2)
        run: sdkmanager --install "build-tools;36.0.0"

      - name: Verify the foss flavor never declares INTERNET
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          AAPT2="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -name aapt2 -type f | sort -V | tail -1)"
          if [ -z "$AAPT2" ]; then
            echo "::error::could not locate aapt2 under $SDK_ROOT/build-tools"
            exit 1
          fi
          PERMS=$("$AAPT2" dump permissions app/build/outputs/apk/foss/debug/app-foss-debug.apk)
          echo "$PERMS"
          # Guard against a vacuous pass: if aapt2 emits nothing (wrong path, wrong tool version),
          # the grep below finds no INTERNET and the check "succeeds" while having verified nothing.
          if [ -z "$PERMS" ]; then
            echo "::error::aapt2 dump permissions produced no output - the assertion below would pass vacuously"
            exit 1
          fi
          if echo "$PERMS" | grep -q "android.permission.INTERNET"; then
            echo "::error::the foss flavor must stay network-free — INTERNET leaked into its merged manifest"
            exit 1
          fi

      - name: Fail if the exported Room schemas drifted from what is committed
        # THIS STEP USED TO BE INERT AND PASSED FOR IT.
        #
        # It was `git diff --exit-code -- app/schemas` on its own, which assumes the build rewrites
        # the schema. It does not: Room only *creates* a schema file when one is absent (that is the
        # whole reason committing 13.json fixed the "Empty schema file" crash — see the v13 commit),
        # and an up-to-date or cache-restored KSP task does not run at all. So there was never
        # anything to diff, and the step reported green over a hand-written v14 schema that carried
        # v13's identityHash — impossible for a real export, since v14 adds an entity.
        #
        # Nothing else would have caught it. Room's own DatabaseBundle.isSchemaEqual compares
        # entities and views only, never identityHash, and instrumented tests need a device. The
        # damage lands on MigrationTestHelper, which stamps the bundle's hash into room_master_table
        # and then fails integrity validation against the real database — on a contributor's machine,
        # attributed to their change.
        #
        # So: force the export, then diff. `--rerun-tasks --no-build-cache` is the same cache-bypass
        # that had to be used by hand to produce 13.json; making it permanent is the point, because
        # the previous version of that fix was a temporary step that got removed, which is precisely
        # how this recurred.
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'version\s*=\s*\K[0-9]+' app/src/main/java/com/daymark/app/data/AppDatabase.kt | head -1)
          SCHEMA="app/schemas/com.daymark.app.data.AppDatabase/${VERSION}.json"
          echo "Regenerating schema v${VERSION} with the build cache bypassed"
          rm -f "$SCHEMA"
          ./gradlew :app:kspFossDebugKotlin --no-build-cache --rerun-tasks --stacktrace

          # Guard against a vacuous pass. If the export silently stopped landing here, the file
          # would simply be absent after the `rm` and `git diff` would report a deletion — but a
          # zero-byte file (the exact v13 failure) would diff clean against nothing and this step
          # would go green having verified less than nothing.
          if [ ! -s "$SCHEMA" ]; then
            echo "::error::$SCHEMA is missing or empty after a forced KSP run — the export is not"
            echo "::error::landing, so this check cannot verify anything. Do not treat green as proof."
            exit 1
          fi
          COUNT=$(python3 -c "import json;print(len(json.load(open('$SCHEMA'))['database']['entities']))")
          echo "Regenerated $SCHEMA — $COUNT entities, identityHash $(python3 -c "import json;print(json.load(open('$SCHEMA'))['database']['identityHash'])")"

          # `git status --porcelain`, NOT `git diff` -- and that distinction is the whole point.
          # A schema for a NEWLY ADDED version is untracked, and `git diff` does not show untracked
          # files at all, so the first build after a version bump would regenerate the correct
          # 15.json, find no diff, and report green while the file it just created went uncommitted.
          # That is the same shape as the bug this step was rebuilt to catch: a check that passes
          # because it is looking somewhere the change cannot appear.
          if [ -n "$(git status --porcelain -- app/schemas)" ]; then
            echo "::error::The committed Room schema does not match what Room generates."
            echo "::error::Take the room-schemas artifact and commit it as-is — never hand-edit a"
            echo "::error::schema, the identityHash must be Room's own."
            echo "--- what differs (committed = -, Room's own = +) ---"
            # The DIFF, not the file. An earlier version of this step cat'd the whole schema, which
            # buried a two-line discrepancy under 770 lines of JSON that was already correct — a
            # failure message nobody can read is barely better than no failure message.
            git --no-pager diff --stat -- app/schemas
            git --no-pager diff --unified=1 -- app/schemas
            exit 1
          fi

      - name: Upload the regenerated Room schemas
        # Runs even when the step above fails — that is when it is worth having, since the artifact
        # is the fix. There is no Android SDK on the dev machine, so a correct schema can only come
        # from a machine like this one.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: error

      - name: Upload foss debug APK
        uses: actions/upload-artifact@v7
        with:
          name: daymark-foss-debug
          path: app/build/outputs/apk/foss/debug/app-foss-debug.apk
          if-no-files-found: error

      - name: Upload sync debug APK
        uses: actions/upload-artifact@v7
        with:
          name: daymark-sync-debug
          path: app/build/outputs/apk/sync/debug/app-sync-debug.apk
          if-no-files-found: error
