name: Release

on:
  push:
    # Any version tag, typed with or without its "v": `v0.4.1` and `0.4.1` both release 0.4.1.
    tags: ["v*", "[0-9]*"]
  # Runs this workflow, as it stands on the chosen branch, against a tag that already exists: a
  # release whose run failed is published again without moving or recreating its tag, because
  # re-running a failed run would replay the workflow as it was when the tag was made.
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag to publish again, like 0.4.1 (a new version starts on the Releases page)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Run workflow only publishes a tag that already exists. A tag it created itself would not
      # start companion.yml, so a new version is made on the Releases page, which builds both.
      - name: Check the tag exists
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --silent 2>/dev/null; then
            echo "::error::there is no tag ${TAG}. To release a new version, create a release with that tag on the Releases page; that builds the APK and the Companion image. Run workflow only publishes again a tag that already exists."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # See build.yml: skip the flaky ~1GB emulator ("tools") download the build never uses.
          packages: "platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0 build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # One version tag releases the APK here and the Companion image in companion.yml, both
      # under the tag minus any leading `v`. The version comes from the tag and nothing else: it is
      # handed to the build below, so the release page, the image and Settings ▸ About always name
      # the same version. A version with a label (`-beta.1`) is always published as a pre-release;
      # any other keeps what the release page was given, so a 0.x version can be a full release.
      - name: Read the version from the tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag ${tag} is not a version like 0.4.1 or v0.4.1-beta.1; nothing is published"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=" >> "$GITHUB_OUTPUT" ;; esac
          echo "Releasing version $version"

      # A release is signed with the release key or it is not published (#224). The app's build
      # falls back to the committed testing key when no keystore is given, which keeps build.yml
      # green on forks; here that fallback would publish an APK that cannot update a real install
      # and that anyone can re-sign, so a missing secret stops the job before it builds. The
      # check is done in shell because the `secrets` context is not allowed inside `if:`, and it
      # names which secret is missing, never what any of them holds.
      # Only the `foss` (flagship, network-free) flavor is published here. The opt-in `sync`
      # flavor (docs/COMPANION_PHONE.md) is not feature-complete and will get its own
      # release path once it is.
      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::refusing to release — these signing secrets are not set:$missing. Add them under Settings → Secrets and variables → Actions, then run this workflow again with the tag."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew assembleFossRelease --stacktrace -PreleaseVersion="${{ steps.version.outputs.value }}"

      # Defense in depth: re-verify here too, not just in build.yml's PR checks — a tag can be
      # pushed against a commit/ref that never ran those checks.
      - name: Install build-tools (for aapt2)
        run: sdkmanager --install "build-tools;36.0.0"

      - name: Verify the published APK never declares INTERNET
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          AAPT2="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -name aapt2 -type f | sort -V | tail -1)"
          if [ -z "$AAPT2" ]; then
            echo "::error::could not locate aapt2 under $SDK_ROOT/build-tools"
            exit 1
          fi
          PERMS=$("$AAPT2" dump permissions app/build/outputs/apk/foss/release/app-foss-release.apk)
          echo "$PERMS"
          # Guard against a vacuous pass: if aapt2 emits nothing (wrong path, wrong tool version),
          # the grep below finds no INTERNET and the check "succeeds" while having verified nothing.
          if [ -z "$PERMS" ]; then
            echo "::error::aapt2 dump permissions produced no output - the assertion below would pass vacuously"
            exit 1
          fi
          if echo "$PERMS" | grep -q "android.permission.INTERNET"; then
            echo "::error::refusing to publish — the foss release APK declares INTERNET"
            exit 1
          fi

      # Secrets that are set but wrong (a keystore of the testing key, say) still build. So the
      # finished APK's signer is compared against the committed testing key and refused if they
      # match, or if it is any Android debug certificate (#224).
      - name: Verify the published APK is not signed with a testing key
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)"
          APK=app/build/outputs/apk/foss/release/app-foss-release.apk
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          # The certificate lines name no secret, and printing them makes a refusal readable.
          echo "$CERTS"
          # The label before the digest varies by apksigner version and scheme ("Signer #1",
          # "V2 Signer:", "Signer (minSdkVersion=…)"), so only the source stamp's line is set aside.
          SIGNER=$(echo "$CERTS" | grep -iv 'source stamp' | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 | tr -d ': \r' | tr 'A-F' 'a-f')
          TESTING=$(keytool -exportcert -keystore app/ci-signing/ci-debug.keystore -storepass daymark-ci-public -alias daymark-ci | sha256sum | cut -d' ' -f1)
          # Guard against a vacuous pass, as above: no digest means nothing was compared.
          if [ -z "$SIGNER" ] || [ -z "$TESTING" ]; then
            echo "::error::could not read a signing certificate digest - the comparison below would pass vacuously"
            exit 1
          fi
          if [ "$SIGNER" = "$TESTING" ] || echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "::error::refusing to publish — the release APK is signed with a testing key, not the release key"
            exit 1
          fi
          echo "Signed with the release key: $SIGNER"

      # The fingerprint of the exact file uploaded, taken after every check has passed (#226).
      - name: Compute the APK's SHA-256
        run: |
          cd app/build/outputs/apk/foss/release
          sha256sum app-foss-release.apk > app-foss-release.apk.sha256
          DIGEST=$(cut -d' ' -f1 app-foss-release.apk.sha256)
          {
            echo "**SHA-256 of app-foss-release.apk:** \`$DIGEST\`"
            echo
            echo "Check a download with \`sha256sum app-foss-release.apk\`; the two must match exactly."
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/foss/release/app-foss-release.apk
            app/build/outputs/apk/foss/release/app-foss-release.apk.sha256
          body_path: ${{ runner.temp }}/release-notes.md
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          # Empty leaves the release's own pre-release box as it was ticked on the release page.
          prerelease: ${{ steps.version.outputs.prerelease }}
