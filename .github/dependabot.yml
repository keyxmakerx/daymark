version: 2

# Why there are so many `ignore` rules here
# ----------------------------------------
# Several upgrades in this project are not "bump the number and see" — they are coupled to the
# Android Gradle Plugin, to Gradle itself, or to each other, and Dependabot proposes them one at a
# time in ways that cannot build. Left alone it reopens the same un-mergeable PRs every week, which
# trains everyone to ignore CI failures. Each rule below therefore says WHY it exists and what
# would unblock it. **Do not delete a rule without reading its comment and re-checking the claim.**
#
# This repo builds only through CI (no Android SDK on the maintainer's machine), so a bad merge
# means a red default branch found late. The bias here is deliberately toward blocking.

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns:
          - "androidx.*"
    ignore:
      # --- Android Gradle Plugin -------------------------------------------------------------
      # AGP 9.x removes the legacy variant API, turns on built-in Kotlin by default, and raises the
      # minimum Gradle to 9.1.0 (the wrapper is on 8.11.1). The variant-API part is actually cheap
      # here — nothing in this repo uses applicationVariants/libraryVariants/variantFilter/etc —
      # but the Gradle wrapper jump and the built-in-Kotlin decision are a deliberate, reviewed
      # piece of work, not a dependency bump.
      - dependency-name: "com.android.tools.build:gradle"
        versions: [">=9.0.0"]

      # --- Kotlin, and KSP, which must move together -----------------------------------------
      # Two separate problems:
      #  1. Kotlin and KSP are version-locked (KSP is published as "<kotlin>-<ksp>"). Dependabot
      #     bumps them in separate PRs, so a Kotlin-only bump cannot build by construction. This is
      #     the likely cause of the failing "Bump kotlin from 2.0.21 to 2.4.0" PR.
      #  2. Kotlin 2.4.0 changed default module naming to include a colon; KSP <= 2.3.9 then emits
      #     invalid identifiers specifically when Dagger/Hilt processes `internal` provider methods
      #     (google/ksp#2964, fixed in KSP 2.3.10/2.3.11). This repo has internal Hilt providers.
      # Unblocked by: a single hand-made PR moving kotlin + ksp together, onto KSP >= 2.3.10, with
      # Hilt/Dagger checked against that Kotlin (Dagger publishes no support matrix and has broken
      # on new Kotlin metadata before — google/dagger#5001).
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.google.devtools.ksp*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

      # --- Hilt / Dagger ----------------------------------------------------------------------
      # Dagger 2.59 makes AGP 9 a HARD requirement for anyone applying the Hilt Gradle plugin,
      # which this project does. 2.58's notes say AGP 9 support was held back precisely "because it
      # forces users onto AGP 9". So Hilt currency and the AGP 9 migration are one atomic decision,
      # not separable work — which is why "Bump hilt from 2.52 to 2.60.1" fails.
      # Ceiling while on AGP 8.x: 2.58. Unblocked by: the AGP 9 migration above.
      - dependency-name: "com.google.dagger:*"
        versions: [">=2.59"]

      # --- Compose: constraint LIFTED ------------------------------------------------------
      # There was a `>=2025.05.00` bound here because Compose foundation >= 1.9.0 bundles lint
      # checks needing AGP >= 8.8.2, and the repo was on 8.7.3. Stage 1 moved it to AGP 8.13, which
      # cleared that floor, and the BOM is now on 2026.06.01 with the FlowRow opt-ins removed.
      # Recorded rather than silently deleted so nobody re-adds it from the old docs.

      # --- Room: constraint LIFTED -------------------------------------------------------------
      # There was a `>=2.7.0` bound here because 2.7 empties androidx.room:room-ktx into
      # room-runtime ("the artifact is now blank. Please remove it from your dependency list")
      # and this repo declared it. That work is DONE: the project is on Room 2.8.4, room-ktx is
      # no longer declared, and schema export runs through the Room Gradle plugin with a CI guard
      # on app/schemas. So Room updates flow normally again. Recorded rather than silently deleted,
      # so nobody re-adds the bound from the old docs.

      # --- androidx runtime libraries that jumped to the AGP 9 / compileSdk 37 floor -----------
      # These were bumped, merged, and turned main RED. CheckAarMetadata failed with 17 issues, all
      # variations of: "requires libraries and applications that depend on it to compile against
      # version 37 or later of the Android APIs" and "requires Android Gradle plugin 9.1.0 or
      # higher". The project is on AGP 8.13 / compileSdk 35.
      #
      # The trap worth naming: these are NOT the Dagger/Hilt 2.x artifacts, so they look independent
      # of the AGP 9 block — androidx.hilt versions separately from com.google.dagger. They are not.
      # androidx.hilt:hilt-navigation-compose 1.4.0 requires AGP 9.1 directly, on its own.
      #
      # Bounds are set at the exact versions observed to fail, so anything below still flows.
      #
      # Unblocked by: NOT the AGP 9 migration, despite what an earlier version of this comment
      # said. These need compileSdk 37, which needs AGP 9.2, which needs Kotlin above 2.3.21 —
      # and Kotlin is capped at 2.3.21 because Dagger's bundled kotlin-metadata-jvm is 2.3.21 and
      # rejects Kotlin 2.4 metadata outright (google/dagger#5177; verified in Dagger master's own
      # version catalog). So this tier is gated on an UPSTREAM DAGGER RELEASE whose
      # kotlin-metadata-jvm is 2.4.x. See "Move C" in docs/TOOLCHAIN.md.
      - dependency-name: "androidx.core:*"
        versions: [">=1.19.0"]
      - dependency-name: "androidx.activity:*"
        versions: [">=1.13.0"]
      - dependency-name: "androidx.lifecycle:*"
        versions: [">=2.11.0"]
      - dependency-name: "androidx.hilt:*"
        versions: [">=1.4.0"]
      # Not in the failure list itself, but androidx.navigationevent:1.0.0 was — and it arrives with
      # navigation 2.9.x. Bounded conservatively rather than risk a second red main to find out;
      # over-blocking costs a skipped update, under-blocking costs a broken default branch.
      - dependency-name: "androidx.navigation:*"
        versions: [">=2.9.0"]

      # --- lazysodium -------------------------------------------------------------------------
      # Documented at length in gradle/libs.versions.toml: lazysodium-java 5.2.0's Gradle metadata
      # marks it JVM-21-only, but :sync-crypto (and the app) target JVM 17, so 5.2.0 fails variant
      # resolution outright. 5.1.0 is the newest release whose java artifact is JVM-8+ and whose
      # android artifact also exists — and the two MUST stay on the same version, because
      # SyncCrypto is compiled against lazysodium-java's copy of the shared types and runs against
      # lazysodium-android's. This pin is a considered decision that Dependabot keeps re-proposing.
      # Unblocked by: moving the whole project to JVM 21.
      - dependency-name: "com.goterl:lazysodium-java"
        versions: [">=5.2.0"]
      - dependency-name: "com.goterl:lazysodium-android"
        versions: [">=5.2.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Deliberately unconstrained. The open actions/* bumps are not failing CI, and action major
    # versions mostly change the bundled Node runtime — the build log already warns that
    # actions/checkout@v4 targets the deprecated Node 20. Reviewed and merged normally.

  # The companion server is a SEPARATE Gradle build with its own wrapper and its own catalog, so
  # the root gradle entry above never sees it. It is also the only internet-facing code in this
  # repo — a Ktor/Netty stack that was, until this entry existed, frozen and entirely unwatched.
  - package-ecosystem: gradle
    directory: "/companion/server"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The companion web bundle is vendored into the image at build time and served to the browser
  # that performs the client-side crypto. A compromised or vulnerable dependency here reaches the
  # place where plaintext actually exists.
  - package-ecosystem: npm
    directory: "/companion/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Base images in companion/Dockerfile are pinned by digest, which is correct for reproducibility
  # and useless for staying patched — a pinned digest never updates itself. This is what turns
  # those pins from "frozen" into "deliberately current".
  - package-ecosystem: docker
    directory: "/companion"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
