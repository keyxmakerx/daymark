# Daymark Companion — hardened deployment.
#
# THERE IS NO BUNDLED REVERSE PROXY. This stack starts the application and nothing
# else. It speaks plain HTTP on 127.0.0.1:8080 and expects YOUR proxy — Cosmos Cloud,
# Caddy, Traefik, nginx, NPM, a Cloudflare tunnel — to terminate TLS in front of it.
# Worked configs for several proxies live in docs/alternatives/.
#
#   cp .env.example .env && edit          # DAYMARK_DOMAIN, DAYMARK_TRUSTED_PROXIES
#   mkdir -p secrets && chmod 700 secrets
#   openssl rand -base64 48 | tr -d '\n' > secrets/auth_token
#   sudo chown 65532:65532 secrets/auth_token && chmod 400 secrets/auth_token
#   docker compose up -d --build
#
#   ^ the chown matters. Compose ignores the secrets uid/gid/mode keys outside Swarm, so
#     the container sees the HOST file's ownership. Left as root:root 0600, UID 65532
#     cannot read it and the server exits on startup.
#
# TWO THINGS YOUR PROXY MUST DO. Neither is optional. The full nine-point contract is
# §3 of docs/COMPANION_DEPLOYMENT_HARDENING.md; these two are the ones that bite first.
#
#   1. Set DAYMARK_TRUSTED_PROXIES to the proxy's source address AS THE APP SEES IT.
#      Leave it unset and every per-client control — sync auth lockout, TOTP lockout,
#      the recovery rate limit — keys on the proxy instead of the client, so all clients
#      share one bucket and eight bad tokens from one attacker lock out everybody.
#
#   2. Add Strict-Transport-Security at the proxy. The app sends CSP, X-Frame-Options,
#      X-Content-Type-Options and Referrer-Policy on every response, but deliberately
#      NOT HSTS, because it cannot know whether it is behind TLS.
#
# HOW YOUR PROXY REACHES THE APP — pick whichever matches your setup:
#
#   a. Proxy running on the Docker HOST as a process
#        Point it at http://127.0.0.1:8080. Nothing more to do; that is the default.
#
#   b. Proxy running in a CONTAINER (Cosmos Cloud, Traefik, NPM, a containerised Caddy)
#        Attach it to this stack's network and address the app by name:
#            docker network connect daymark-companion_back <your-proxy-container>
#            upstream: http://daymark-companion:8080
#        Then apply the no-egress override, which drops the published host port and
#        takes the app's route to the outside world away completely:
#            docker compose -f docker-compose.yml -f docker-compose.no-egress.yml up -d
#
# NO top-level `version:` key — obsolete since Compose v2; current Compose warns on it.

name: daymark-companion

# ── Shared hardening ────────────────────────────────────────────────────────
x-hardened: &hardened
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - "no-new-privileges:true"
    - "apparmor=docker-default"     # verify with: aa-status | grep docker-default
  # Docker's DEFAULT seccomp profile applies automatically. NEVER add seccomp:unconfined.

# `local` driver: rotates AND compresses. `json-file` defaults to max-size:-1 (UNLIMITED)
# and its max-file is inert unless max-size is also set. This is the disk-fill footgun.
x-logging: &logging
  driver: "local"
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── Application (the only service) ───────────────────────────────────────
  companion:
    # `build` stays because CI boots this file and because local development needs it. To run
    # the image CI published instead of building your own, set DAYMARK_IMAGE to a digest and
    # `docker compose pull` before `up` — see companion/README.md.
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DAYMARK_IMAGE:-daymark-companion:1.0.0}
    container_name: daymark-companion
    <<: *hardened
    logging: *logging

    # Published to LOOPBACK ONLY by default, never 0.0.0.0 — a reverse proxy on this host
    # can reach it, nothing on the LAN can. Override DAYMARK_BIND_IP only if your proxy is
    # on another machine AND the link between them is already encrypted; the app speaks
    # plain HTTP and authenticates with a bearer token, so anything that can read the wire
    # can read the token.
    ports:
      - "${DAYMARK_BIND_IP:-127.0.0.1}:${DAYMARK_HOST_PORT:-8080}:8080"

    networks:
      back:
        ipv4_address: 10.89.0.3

    user: "65532:65532"          # distroless nonroot. WAS 10001 — see §4.4 migration.

    environment:
      DAYMARK_BIND_ADDR: "0.0.0.0"        # all interfaces INSIDE the container only
      DAYMARK_PORT:      "8080"
      DAYMARK_DATA_DIR:  "/data"
      DAYMARK_WEB_DIR:   "/app/web"
      DAYMARK_BASE_PATH: "/"
      DAYMARK_LOG_LEVEL: "warn"
      TZ:                "UTC"

      # THE most important line in this file, and it is EMPTY BY DEFAULT ON PURPOSE:
      # trust no forwarded headers until the operator names the proxy. Set it in .env to
      # the proxy's exact source IP/CIDR. Never a whole bridge CIDR — any co-resident
      # container could then forge X-Forwarded-For and walk past the auth lockout.
      # Getting it WRONG fails quiet (headers ignored, one shared lockout bucket), so the
      # server logs a loud one-time warning if forwarded headers arrive while this is
      # unset. Watch for it on first boot.
      DAYMARK_TRUSTED_PROXIES: "${DAYMARK_TRUSTED_PROXIES:-}"

      # The real external origin, as clients type it. Not a LAN alias: this is the
      # WebAuthn RP-ID and the base URL for invite links in outbound email. Without it,
      # RouteUrls.resolveBaseUrl() falls back to the client-supplied Host header and
      # emails an attacker-controlled invite link. See §6 item 6.
      DAYMARK_PUBLIC_BASE_URL:  "${DAYMARK_PUBLIC_SCHEME:-https}://${DAYMARK_DOMAIN:?set in .env, e.g. daymark.example.com}"
      DAYMARK_WEBAUTHN_RP_ID:   "${DAYMARK_DOMAIN:?set in .env, e.g. daymark.example.com}"
      DAYMARK_WEBAUTHN_ORIGINS: "${DAYMARK_PUBLIC_SCHEME:-https}://${DAYMARK_DOMAIN:?set in .env, e.g. daymark.example.com}"

      DAYMARK_AUTH_TOKEN_FILE: "/run/secrets/companion_auth_token"

      # App-layer limits (Config.kt defaults, stated explicitly so they are auditable).
      DAYMARK_RATE_LIMIT_RPS:     "5"
      DAYMARK_MAX_REQUEST_BYTES:  "27262976"   # 26 MiB
      DAYMARK_MAX_BLOB_BYTES:     "26214400"   # 25 MiB
      DAYMARK_ACCESS_LOG_SOURCE_IP:     "false"
      DAYMARK_ACCESS_LOG_RETENTION_DAYS: "90"

      # A JVM under a container memory limit defaults to a 25% heap. Without this you
      # get a ~192M heap on a 768M limit and will be confused by the OOMs.
      # -Dorg.sqlite.tmpdir is NOT optional. sqlite-jdbc is JNI: on the first connection it
      # extracts libsqlitejdbc.so into java.io.tmpdir and dlopen()s it. /tmp is mounted
      # noexec (correctly — keep it), so loading from there fails with
      # "UnsatisfiedLinkError: failed to map segment from shared object" and the JVM exits
      # during Application.module(), before it ever binds a port. Pointing only the native
      # extraction at the executable /data volume keeps noexec everywhere else.
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=70
        -XX:+ExitOnOutOfMemoryError
        -XX:-UsePerfData
        -Djava.io.tmpdir=/tmp
        -Dorg.sqlite.tmpdir=/data

    # No uid/gid/mode here: Compose IGNORES them outside Swarm and only prints
    # "warning: secrets 'uid', 'gid' and 'mode' are not supported, they will be ignored".
    # The mounted file keeps the ownership and mode of the file on the host, so it must be
    # made readable by UID 65532 there — see the header of this file.
    secrets:
      - companion_auth_token

    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev

    volumes:
      - blobs:/data

    ulimits:
      nofile: { soft: 4096, hard: 8192 }

    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
          pids: 256
        reservations:
          memory: 256M

    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]   # static Go binary; no shell exists
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s        # Engine >= 25: fast first-start convergence

networks:
  # One network. The app is its only member unless you attach your own proxy container.
  back:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: dmk-back

      # No NAT for outbound traffic. The app has no business dialling out: everything it
      # needs is on disk, and the one deliberate exception (SMTP) is off by default. With
      # masquerade disabled, packets leave the host carrying a 10.89.0.0/24 source, which
      # nothing upstream will route a reply to — so egress does not complete.
      #
      # Be precise about what this buys: packets still LEAVE, they just get no answer. It
      # is not the same as dropping them, and it does not stop the container reaching
      # services bound to 0.0.0.0 on this host via the bridge gateway. For the airtight
      # version — a network with no gateway address at all — use
      # docker-compose.no-egress.yml, which needs your proxy to be a container on this
      # network, because published ports do NOT work on Docker `internal:` networks
      # (moby/moby#36174, still open).
      #
      # Enabling outbound SMTP means turning this back on; see §2.1 of
      # docs/COMPANION_DEPLOYMENT_HARDENING.md.
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 10.89.0.0/24

volumes:
  blobs:

secrets:
  companion_auth_token:
    file: ./secrets/auth_token     # chmod 600, gitignored
  # companion_smtp_pass:
  #   file: ./secrets/smtp_pass
