<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!--
      No <meta http-equiv="Content-Security-Policy"> here: the CSP is sent by the
      server as a response header (see companion/server Application.kt) so it also
      covers error pages and cannot be stripped by editing the document. When this
      file is opened directly from disk (file://) for Phase-0 offline use, the page
      still makes zero network requests — everything is vendored and bundled.
    -->
    <title>Daymark Companion — owner console</title>
    <meta name="description" content="Read, sync and share your Daymark journal on your own server. Your entries leave this browser only when you sync or share them." />
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <!-- No inline style here: the strict CSP (style-src 'self') blocks inline styles,
           so this fallback is intentionally unstyled, which is fine and accessible. -->
      <p>
        The Daymark Companion owner console needs JavaScript to open your backup in the
        browser. Without it this page does nothing and sends nothing.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
